services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    volumes:
      - tcg_mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URI: mongodb://root:rootpass@mongo:27017/tcgdb?authSource=admin
      JWT_SECRET: cambia-esto-en-produccion
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8099:80"
    depends_on:
      - backend

  # Servicio de un solo uso para poblar la base de datos:
  #   docker compose --profile seed run --rm seed
  seed:
    build: ./backend
    profiles: ["seed"]
    command: ["npm", "run", "seed"]
    environment:
      MONGO_URI: mongodb://root:rootpass@mongo:27017/tcgdb?authSource=admin
    # Monta la data en vivo del host: reseedear NO requiere reconstruir la imagen.
    volumes:
      - ./backend/src/seed/data:/app/src/seed/data:ro
    depends_on:
      - mongo

volumes:
  tcg_mongo_data:
