# Caché en disco para las imágenes de cartas (pokemontcg.io es lento):
# tras la primera descarga quedan servidas desde el propio servidor.
proxy_cache_path /var/cache/nginx/cards levels=1:2 keys_zone=cards:10m
                 max_size=3g inactive=90d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Imágenes de cartas → proxy con caché local (ver frontend/src/app/core/utils/card-image.ts).
    # `^~` evita que gane la location regex de assets (.png) de más abajo.
    location ^~ /img/ {
        rewrite ^/img/(.*)$ /$1 break;
        proxy_pass https://images.pokemontcg.io;
        proxy_set_header Host images.pokemontcg.io;
        proxy_ssl_server_name on;
        proxy_cache cards;
        proxy_cache_valid 200 90d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # API → contenedor backend (mismo origen para el navegador, sin CORS).
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash de contenido → cache larga e inmutable.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html NUNCA se cachea → siempre toma el bundle nuevo tras un deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # SPA fallback (Angular router).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
